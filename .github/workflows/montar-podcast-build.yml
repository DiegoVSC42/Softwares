name: Build montar-podcast

on:
  push:
    paths:
      - 'montar-podcast/**'
      - '.github/workflows/montar-podcast-build.yml'
  workflow_dispatch:

jobs:
  # ----------------------------------------------------------------------
  # Windows: gera o .exe com ffmpeg e ffprobe embutidos
  # ----------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: montar-podcast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: Baixar ffmpeg e ffprobe (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $ff = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $ff.FullName -Destination ffmpeg.exe
          Copy-Item $fp.FullName -Destination ffprobe.exe

      - name: Empacotar com PyInstaller
        run: >
          pyinstaller --onefile --windowed --icon icon.ico --noconfirm
          --name MontarPodcast
          --add-binary "ffmpeg.exe;."
          --add-binary "ffprobe.exe;."
          montar_podcast.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: montar-podcast/dist/MontarPodcast.exe

  # ----------------------------------------------------------------------
  # Mac: gera o .app com ffmpeg embutido e compacta em .zip com ditto
  # ----------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: montar-podcast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: Baixar ffmpeg e ffprobe (Mac)
        run: |
          curl -L "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip
          curl -L "https://evermeet.cx/ffprobe/getrelease/zip" -o ffprobe.zip
          unzip -o ffprobe.zip
          chmod +x ffmpeg ffprobe

      - name: Empacotar com PyInstaller
        run: >
          pyinstaller --onefile --windowed --icon icon.icns --noconfirm
          --name MontarPodcast
          --add-binary "ffmpeg:."
          --add-binary "ffprobe:."
          montar_podcast.py

      - name: Compactar .app com ditto
        run: ditto -c -k --sequesterRsrc --keepParent dist/MontarPodcast.app MontarPodcast-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: montar-podcast/MontarPodcast-mac.zip

  # ----------------------------------------------------------------------
  # Release: publica o .exe (Windows) e o .zip (Mac) no GitHub, com link
  # de download fixo em: releases/download/montar-podcast/<arquivo>
  # ----------------------------------------------------------------------
  release:
    needs: [ windows, mac ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao do programa
        id: versao
        run: |
          V=$(grep -m1 -E '^(APP_)?VERSION' montar-podcast/montar_podcast.py | cut -d'"' -f2)
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos (exe e zip)
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Gerar versao.json (usado pela atualizacao automatica)
        run: |
          EXE=$(cd artefatos && find . -name '*.exe' -printf '%f\n' | head -1)
          INTEL=$(cd artefatos && find . -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          ARM=$(cd artefatos && find . -name '*.zip' ! -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          printf '{\n  "versao": "%s",\n  "windows": "%s",\n  "mac_arm": "%s",\n  "mac_intel": "%s",\n  "obrigatoria": false,\n  "notas": ""\n}\n' \
            "${{ steps.versao.outputs.v }}" "$EXE" "$ARM" "$INTEL" > artefatos/versao.json
          cat artefatos/versao.json
      - name: Publicar exe e zip no Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: montar-podcast
          name: "Montar Podcast v${{ steps.versao.outputs.v }}"
          body: "Versao ${{ steps.versao.outputs.v }}. Os nomes dos arquivos e o link de download nao mudam."
          files: |
            artefatos/**/*.exe
            artefatos/**/*.zip
            artefatos/versao.json