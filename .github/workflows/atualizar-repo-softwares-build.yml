name: Build atualizar-repo-softwares

on:
  push:
    paths:
      - 'atualizar-repo-softwares/**'
      - '.github/workflows/atualizar-repo-softwares-build.yml'
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: atualizar-repo-softwares
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller certifi
      - run: pyinstaller --onefile --windowed --icon icon.ico --name AtualizarSoftwares atualizar_repo_softwares.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: atualizar-repo-softwares/dist/AtualizarSoftwares.exe

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: atualizar-repo-softwares
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller certifi
      - run: pyinstaller --onefile --windowed --icon icon.icns --name AtualizarSoftwares atualizar_repo_softwares.py
      - run: ditto -c -k --sequesterRsrc --keepParent dist/AtualizarSoftwares.app AtualizarSoftwares-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: atualizar-repo-softwares/AtualizarSoftwares-mac.zip

  # ----------------------------------------------------------------------
  # Release: publica o .exe (Windows) e o .zip (Mac) no GitHub, com link
  # de download fixo em: releases/download/atualizar-repo-softwares/<arquivo>
  # ----------------------------------------------------------------------
  release:
    needs: [ windows, mac ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao do programa
        id: versao
        run: |
          V=$(grep -m1 -E '^(APP_)?VERSION' atualizar-repo-softwares/atualizar_repo_softwares.py | cut -d'"' -f2)
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos (exe e zip)
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Gerar versao.json (usado pela atualizacao automatica)
        run: |
          EXE=$(cd artefatos && find . -name '*.exe' -printf '%f\n' | head -1)
          INTEL=$(cd artefatos && find . -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          ARM=$(cd artefatos && find . -name '*.zip' ! -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          printf '{\n  "versao": "%s",\n  "windows": "%s",\n  "mac_arm": "%s",\n  "mac_intel": "%s",\n  "obrigatoria": false,\n  "notas": ""\n}\n' \
            "${{ steps.versao.outputs.v }}" "$EXE" "$ARM" "$INTEL" > artefatos/versao.json
          cat artefatos/versao.json
      - name: Publicar exe e zip no Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: atualizar-repo-softwares
          name: "Atualizar Softwares v${{ steps.versao.outputs.v }}"
          body: "Versao ${{ steps.versao.outputs.v }}. Os nomes dos arquivos e o link de download nao mudam."
          files: |
            artefatos/**/*.exe
            artefatos/**/*.zip
            artefatos/versao.json