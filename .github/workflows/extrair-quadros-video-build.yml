name: extrair-quadros-video-build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: extrair-quadros-video

jobs:
  # ----------------------------------------------------------------------
  # Windows: gera o .exe com ffmpeg embutido
  # ----------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: Baixar ffmpeg (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          $prb = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe
          Copy-Item $prb.FullName -Destination ffprobe.exe

      - name: Empacotar com PyInstaller
        run: pyinstaller --onefile --windowed --icon icon.ico --noconfirm --name ExtrairQuadros --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." extrair_quadros_video.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: extrair-quadros-video/dist/ExtrairQuadros.exe

  # ----------------------------------------------------------------------
  # Mac Apple Silicon (M1 em diante): gera o .app, ffmpeg arm64 embutido,
  # e compacta em .zip com ditto
  # ----------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: Baixar ffmpeg (Mac Apple Silicon)
        run: |
          curl -fL "https://www.osxexperts.net/ffmpeg711arm.zip" -o ffmpeg.zip || curl -fL "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip
          curl -fL "https://www.osxexperts.net/ffprobe711arm.zip" -o ffprobe.zip || curl -fL "https://evermeet.cx/ffprobe/getrelease/zip" -o ffprobe.zip
          unzip -o ffprobe.zip
          chmod +x ffmpeg ffprobe

      - name: Empacotar com PyInstaller
        run: pyinstaller --onefile --windowed --icon icon.icns --noconfirm --name ExtrairQuadros --add-binary "ffmpeg:." --add-binary "ffprobe:." extrair_quadros_video.py

      - name: Compactar .app com ditto
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ExtrairQuadros.app ExtrairQuadros-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: extrair-quadros-video/dist/ExtrairQuadros-mac.zip

  # ----------------------------------------------------------------------
  # Mac Intel: mesmo .app, buildado num runner Intel de verdade, com
  # ffmpeg x86_64 embutido, compactado com sufixo proprio (-mac-intel.zip)
  # ----------------------------------------------------------------------
  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi

      - name: Baixar ffmpeg (Mac Intel)
        run: |
          curl -fL "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip
          curl -fL "https://evermeet.cx/ffprobe/getrelease/zip" -o ffprobe.zip
          unzip -o ffprobe.zip
          chmod +x ffmpeg ffprobe

      - name: Empacotar com PyInstaller
        run: pyinstaller --onefile --windowed --icon icon.icns --noconfirm --name ExtrairQuadros --add-binary "ffmpeg:." --add-binary "ffprobe:." extrair_quadros_video.py

      - name: Compactar .app com ditto
        run: |
          cd dist
          mv ExtrairQuadros.app ExtrairQuadros-intel.app
          ditto -c -k --sequesterRsrc --keepParent ExtrairQuadros-intel.app ExtrairQuadros-mac-intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel-build
          path: extrair-quadros-video/dist/ExtrairQuadros-mac-intel.zip

  # ----------------------------------------------------------------------
  # Release: publica o .exe (Windows) e os dois .zip (Mac Apple Silicon e
  # Mac Intel) com link fixo em releases/download/extrair-quadros-video/<arquivo>
  # ----------------------------------------------------------------------
  release:
    needs: [ windows, mac, mac-intel ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao do programa
        id: versao
        run: |
          V=$(grep -m1 '^APP_VERSION' extrair_quadros_video.py | cut -d'"' -f2)
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos (exe e zips)
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Gerar versao.json (usado pela atualizacao automatica)
        run: |
          EXE=$(cd artefatos && find . -name '*.exe' -printf '%f\n' | head -1)
          INTEL=$(cd artefatos && find . -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          ARM=$(cd artefatos && find . -name '*.zip' ! -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          printf '{\n  "versao": "%s",\n  "windows": "%s",\n  "mac_arm": "%s",\n  "mac_intel": "%s",\n  "obrigatoria": false,\n  "notas": ""\n}\n' \
            "${{ steps.versao.outputs.v }}" "$EXE" "$ARM" "$INTEL" > artefatos/versao.json
          cat artefatos/versao.json
      - name: Publicar exe e zips no Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: extrair-quadros-video
          name: "Extrair Quadros v${{ steps.versao.outputs.v }}"
          body: "Versao ${{ steps.versao.outputs.v }}. Os nomes dos arquivos e o link de download nao mudam."
          files: |
            artefatos/**/*.exe
            artefatos/**/*.zip
            artefatos/versao.json