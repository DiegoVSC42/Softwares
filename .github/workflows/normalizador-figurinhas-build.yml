name: Build normalizador-figurinhas

on:
  push:
    paths:
      - 'normalizador-figurinhas/**'

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: normalizador-figurinhas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --onefile --windowed --noconfirm --name normalizador_figurinhas normalizador_figurinhas.py
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: normalizador-figurinhas/dist/normalizador_figurinhas.exe

  build-mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: normalizador-figurinhas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller
      - name: Build app
        run: pyinstaller --onefile --windowed --noconfirm --name normalizador_figurinhas normalizador_figurinhas.py
      - name: Create zip
        run: ditto -c -k --sequesterRsrc --keepParent dist/normalizador_figurinhas.app dist/normalizador_figurinhas-mac.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: normalizador-figurinhas/dist/normalizador_figurinhas-mac.zip

  release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: normalizador-figurinhas
          files: |
            windows-exe/normalizador_figurinhas.exe
            mac-app/normalizador_figurinhas-mac.zip
