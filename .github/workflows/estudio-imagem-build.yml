name: estudio-imagem-build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: estudio-imagem

jobs:
  # ----------------------------------------------------------------------
  # Windows: gera o .exe. Este estudio nao usa ffmpeg -- o motor dele e o
  # Pillow (com o numpy), que entra pelo requirements.txt.
  # ----------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi -r requirements.txt

      - name: Empacotar com PyInstaller
        # O Windows nao tem Info.plist, entao continua com os flags soltos.
        # Cada aba e importada por nome em tempo de execucao, entao precisa
        # ser declarada aqui uma por uma.
        run: pyinstaller --onefile --windowed --icon icon.ico --noconfirm --name ImageStudio --add-data "icon.png;." --add-data "abas;abas" --hidden-import certifi --hidden-import atualizador --hidden-import tema --hidden-import pastas --hidden-import abas --hidden-import abas.comprimir --hidden-import abas.redimensionar --hidden-import abas.figurinhas --hidden-import abas.printshot --hidden-import PIL --hidden-import PIL.Image --hidden-import PIL.ImageDraw --hidden-import PIL.ImageOps --hidden-import PIL.ImageTk --hidden-import PIL.ImageGrab --hidden-import PIL.ImageStat --hidden-import numpy estudio_imagem.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: estudio-imagem/dist/ImageStudio.exe

  # ----------------------------------------------------------------------
  # Mac Apple Silicon (M1 em diante): gera o .app e compacta em .zip com
  # ditto
  # ----------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi -r requirements.txt

      - name: Empacotar com PyInstaller
        # Usa o .spec (nao os flags soltos) para o Info.plist do app sair
        # com a versao certa (senao o Finder mostra "0.0.0" em Informacoes).
        run: pyinstaller --noconfirm ImageStudio.spec

      - name: Compactar .app com ditto
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent ImageStudio.app ImageStudio-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: estudio-imagem/dist/ImageStudio-mac.zip

  # ----------------------------------------------------------------------
  # Mac Intel: mesmo .app, buildado num runner Intel de verdade, com sufixo
  # proprio (-mac-intel.zip)
  # ----------------------------------------------------------------------
  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi -r requirements.txt

      - name: Empacotar com PyInstaller
        # Usa o .spec (nao os flags soltos) para o Info.plist do app sair
        # com a versao certa (senao o Finder mostra "0.0.0" em Informacoes).
        run: pyinstaller --noconfirm ImageStudio.spec

      - name: Compactar .app com ditto
        run: |
          cd dist
          mv ImageStudio.app ImageStudio-intel.app
          ditto -c -k --sequesterRsrc --keepParent ImageStudio-intel.app ImageStudio-mac-intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel-build
          path: estudio-imagem/dist/ImageStudio-mac-intel.zip

  # ----------------------------------------------------------------------
  # Release: publica o .exe (Windows) e os dois .zip (Mac Apple Silicon e
  # Mac Intel) com link fixo em releases/download/estudio-imagem/<arquivo>,
  # mais o versao.json que a atualizacao automatica le
  # ----------------------------------------------------------------------
  release:
    needs: [ windows, mac, mac-intel ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Este job trabalha na raiz do repositorio, e nao na subpasta do
    # software: o download dos artefatos cai em "artefatos/" ali, e nao
    # dentro de estudio-imagem/. Sem esta linha, o defaults la de cima
    # mandaria os comandos procurarem a pasta no lugar errado.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao do programa
        id: versao
        run: |
          V=$(grep -m1 '^APP_VERSION' estudio-imagem/estudio_imagem.py | cut -d'"' -f2)
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos (exe e zips)
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Gerar versao.json (usado pela atualizacao automatica)
        run: |
          EXE=$(cd artefatos && find . -name '*.exe' -printf '%f\n' | head -1)
          INTEL=$(cd artefatos && find . -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          ARM=$(cd artefatos && find . -name '*.zip' ! -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          printf '{\n  "versao": "%s",\n  "windows": "%s",\n  "mac_arm": "%s",\n  "mac_intel": "%s",\n  "obrigatoria": false,\n  "notas": ""\n}\n' \
            "${{ steps.versao.outputs.v }}" "$EXE" "$ARM" "$INTEL" > artefatos/versao.json
          cat artefatos/versao.json

      - name: Publicar exe e zips no Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: estudio-imagem
          name: "Image Studio v${{ steps.versao.outputs.v }}"
          body: "Versao ${{ steps.versao.outputs.v }}. Os nomes dos arquivos e o link de download nao mudam."
          files: |
            artefatos/**/*.exe
            artefatos/**/*.zip
            artefatos/versao.json
