name: Build Normalizador de Numeros

on:
  push:
    paths:
      - "normalizador-numeros/**"
      - ".github/workflows/normalizador-numeros-build.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: normalizador-numeros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller certifi
      - name: Build Windows
        run: >
          pyinstaller --onefile --windowed --icon icon.ico
          --name "NormalizadorNumeros"
          normalizador_numeros.py
      - uses: actions/upload-artifact@v4
        with:
          name: normalizador-numeros-windows
          path: normalizador-numeros/dist/NormalizadorNumeros.exe

  mac:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: normalizador-numeros
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller certifi
      - name: Build Mac
        run: >
          pyinstaller --onefile --windowed --icon icon.icns
          --name "NormalizadorNumeros"
          normalizador_numeros.py
      - name: Compactar o .app
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent NormalizadorNumeros.app NormalizadorNumeros-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: normalizador-numeros-mac
          path: normalizador-numeros/dist/NormalizadorNumeros-mac.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao do programa
        id: versao
        run: |
          V=$(grep -m1 -E '^(APP_)?VERSION' normalizador-numeros/normalizador_numeros.py | cut -d'"' -f2)
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          path: artefatos
      - name: Gerar versao.json (usado pela atualizacao automatica)
        run: |
          EXE=$(cd artefatos && find . -name '*.exe' -printf '%f\n' | head -1)
          INTEL=$(cd artefatos && find . -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          ARM=$(cd artefatos && find . -name '*.zip' ! -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          printf '{\n  "versao": "%s",\n  "windows": "%s",\n  "mac_arm": "%s",\n  "mac_intel": "%s",\n  "obrigatoria": false,\n  "notas": ""\n}\n' \
            "${{ steps.versao.outputs.v }}" "$EXE" "$ARM" "$INTEL" > artefatos/versao.json
          cat artefatos/versao.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: normalizador-numeros
          name: "Normalizador de Numeros v${{ steps.versao.outputs.v }}"
          body: "Versao ${{ steps.versao.outputs.v }}. Os nomes dos arquivos e o link de download nao mudam."
          files: |
            artefatos/**/*.exe
            artefatos/**/*.zip
            artefatos/versao.json