name: media-studio-build

on:
  push:
    branches: [ main ]
    paths:
      - 'media-studio/**'
      - '.github/workflows/media-studio-build.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: media-studio

jobs:
  # ----------------------------------------------------------------------
  # Windows: gera o .exe com ffmpeg e ffprobe embutidos
  # ----------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller certifi pyautogui mss -r requirements.txt

      - name: Baixar ffmpeg e ffprobe (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe
          $probe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffprobe.exe | Select-Object -First 1
          Copy-Item $probe.FullName -Destination ffprobe.exe

      - name: Empacotar com PyInstaller
        # O Windows nao tem Info.plist, entao continua com os flags soltos.
        # As abas sao importadas pelo nome, e --collect-submodules leva todas,
        # sem depender de lembrar de listar uma por uma. Ele so acha o pacote
        # com o PYTHONPATH apontando para a pasta: sem isso nao da erro, e o
        # programa sai sem nenhuma aba.
        env:
          PYTHONPATH: ${{ github.workspace }}\media-studio
        run: pyinstaller --onefile --windowed --icon icon.ico --noconfirm --name MediaStudio --paths . --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;." --add-data "icon.png;." --add-data "trabalhador_whisper.py;." --collect-submodules abas --collect-submodules compartilhado --hidden-import certifi --hidden-import numpy --hidden-import atualizador --hidden-import tema --hidden-import pastas --hidden-import conversor --hidden-import dados --hidden-import documento --hidden-import pagina_pdf --hidden-import transcritor media_studio.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: media-studio/dist/MediaStudio.exe

  # ----------------------------------------------------------------------
  # Mac Apple Silicon (M1 em diante)
  # ----------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Instalar dependencias
        # Python autonomo e bibliotecas para macOS 12: o Python comum da
        # maquina de build leva o sistema minimo dela para dentro do app, e o
        # programa deixa de abrir em Mac com sistema mais antigo.
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          uv venv --python 3.13 --python-preference only-managed .venv-empacotar
          uv pip install --python .venv-empacotar/bin/python --python-platform aarch64-apple-darwin --only-binary :all: pyinstaller -r requirements.txt

      - name: Baixar ffmpeg e ffprobe (Mac Apple Silicon)
        # Fonte hospedada no proprio GitHub: evermeet.cx e osxexperts.net
        # recusam conexao vinda de servidor de nuvem.
        run: |
          curl -fL --retry 3 --retry-delay 5 "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-arm64" -o ffmpeg
          curl -fL --retry 3 --retry-delay 5 "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffprobe-darwin-arm64" -o ffprobe
          chmod +x ffmpeg ffprobe
          ./ffmpeg -version | head -1

      - name: Empacotar com PyInstaller
        run: .venv-empacotar/bin/python -m PyInstaller --noconfirm MediaStudio.spec

      - name: Compactar .app com ditto
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Media Studio.app" dist/MediaStudio-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: media-studio/dist/MediaStudio-mac.zip

  # ----------------------------------------------------------------------
  # Mac Intel: mesmo .app, buildado num runner Intel de verdade
  # ----------------------------------------------------------------------
  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Instalar dependencias
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          uv venv --python 3.13 --python-preference only-managed .venv-empacotar
          uv pip install --python .venv-empacotar/bin/python --python-platform x86_64-apple-darwin --only-binary :all: pyinstaller -r requirements.txt

      - name: Baixar ffmpeg e ffprobe (Mac Intel)
        run: |
          curl -fL --retry 3 --retry-delay 5 "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffmpeg-darwin-x64" -o ffmpeg
          curl -fL --retry 3 --retry-delay 5 "https://github.com/eugeneware/ffmpeg-static/releases/latest/download/ffprobe-darwin-x64" -o ffprobe
          chmod +x ffmpeg ffprobe
          ./ffmpeg -version | head -1

      - name: Empacotar com PyInstaller
        run: .venv-empacotar/bin/python -m PyInstaller --noconfirm MediaStudio.spec

      - name: Compactar .app com ditto
        run: ditto -c -k --sequesterRsrc --keepParent "dist/Media Studio.app" dist/MediaStudio-mac-intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel-build
          path: media-studio/dist/MediaStudio-mac-intel.zip

  # ----------------------------------------------------------------------
  # Release: link fixo em releases/download/media-studio/<arquivo>, mais o
  # versao.json que o programa le para saber se saiu versao nova
  # ----------------------------------------------------------------------
  release:
    needs: [ windows, mac, mac-intel ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Este job trabalha na raiz do repositorio: os artefatos caem em
    # "artefatos/" ali, e nao dentro de media-studio/.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao do programa
        id: versao
        run: |
          V=$(grep -m1 '^APP_VERSION' media-studio/media_studio.py | cut -d'"' -f2)
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos (exe e zips)
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Gerar versao.json (usado pela atualizacao automatica)
        run: |
          EXE=$(cd artefatos && find . -name '*.exe' -printf '%f\n' | head -1)
          INTEL=$(cd artefatos && find . -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          ARM=$(cd artefatos && find . -name '*.zip' ! -name '*-mac-intel.zip' -printf '%f\n' | head -1)
          printf '{\n  "versao": "%s",\n  "windows": "%s",\n  "mac_arm": "%s",\n  "mac_intel": "%s",\n  "obrigatoria": false,\n  "notas": ""\n}\n' \
            "${{ steps.versao.outputs.v }}" "$EXE" "$ARM" "$INTEL" > artefatos/versao.json
          cat artefatos/versao.json

      - name: Publicar exe e zips no Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: media-studio
          name: "Media Studio v${{ steps.versao.outputs.v }}"
          body: "Versao ${{ steps.versao.outputs.v }}. Os nomes dos arquivos e o link de download nao mudam."
          files: |
            artefatos/**/*.exe
            artefatos/**/*.zip
            artefatos/versao.json
