name: baixador-videos-build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: baixador-videos

jobs:
  # ----------------------------------------------------------------------
  # Windows: gera o .exe com ffmpeg embutido
  # ----------------------------------------------------------------------
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Baixar ffmpeg (Windows)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $exe = Get-ChildItem -Recurse ffmpeg_tmp -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName -Destination ffmpeg.exe

      - name: Empacotar com PyInstaller
        run: pyinstaller --onefile --windowed --icon icon.ico --noconfirm --name BaixadorDeVideos --add-binary "ffmpeg.exe;." baixador_videos.py

      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: baixador-videos/dist/BaixadorDeVideos.exe

  # ----------------------------------------------------------------------
  # Mac Apple Silicon (M1 em diante): gera o .app, ffmpeg arm64 embutido,
  # e compacta em .zip com ditto
  # ----------------------------------------------------------------------
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Baixar ffmpeg (Mac Apple Silicon)
        run: |
          curl -fL "https://www.osxexperts.net/ffmpeg711arm.zip" -o ffmpeg.zip || curl -fL "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip
          chmod +x ffmpeg

      - name: Empacotar com PyInstaller
        run: pyinstaller --onefile --windowed --icon icon.icns --noconfirm --name BaixadorDeVideos --add-binary "ffmpeg:." baixador_videos.py

      - name: Compactar .app com ditto
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent BaixadorDeVideos.app BaixadorDeVideos-mac.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: baixador-videos/dist/BaixadorDeVideos-mac.zip

  # ----------------------------------------------------------------------
  # Mac Intel: mesmo .app, buildado num runner Intel de verdade, com
  # ffmpeg x86_64 embutido, compactado com sufixo proprio (-mac-intel.zip)
  # ----------------------------------------------------------------------
  mac-intel:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Baixar ffmpeg (Mac Intel)
        run: |
          curl -fL "https://evermeet.cx/ffmpeg/getrelease/zip" -o ffmpeg.zip
          unzip -o ffmpeg.zip
          chmod +x ffmpeg

      - name: Empacotar com PyInstaller
        run: pyinstaller --onefile --windowed --icon icon.icns --noconfirm --name BaixadorDeVideos --add-binary "ffmpeg:." baixador_videos.py

      - name: Compactar .app com ditto
        run: |
          cd dist
          mv BaixadorDeVideos.app BaixadorDeVideos-intel.app
          ditto -c -k --sequesterRsrc --keepParent BaixadorDeVideos-intel.app BaixadorDeVideos-mac-intel.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mac-intel-build
          path: baixador-videos/dist/BaixadorDeVideos-mac-intel.zip

  # ----------------------------------------------------------------------
  # Release: publica o .exe (Windows) e os dois .zip (Mac Apple Silicon e
  # Mac Intel) com link fixo em releases/download/baixador-videos/<arquivo>
  # ----------------------------------------------------------------------
  release:
    needs: [ windows, mac, mac-intel ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Ler versao do programa
        id: versao
        run: |
          V=$(grep -m1 '^APP_VERSION' baixador_videos.py | cut -d'"' -f2)
          echo "v=${V:-0.0.0}" >> "$GITHUB_OUTPUT"

      - name: Baixar artefatos (exe e zips)
        uses: actions/download-artifact@v4
        with:
          path: artefatos

      - name: Publicar exe e zips no Release do GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: baixador-videos
          name: "Baixador de Videos v${{ steps.versao.outputs.v }}"
          body: "Versao ${{ steps.versao.outputs.v }}. Os nomes dos arquivos e o link de download nao mudam."
          files: |
            artefatos/**/*.exe
            artefatos/**/*.zip
